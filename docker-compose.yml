
version: '3.9'

services:
  api:
    depends_on:
      - postgres
    build: ./backend
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
    
  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kovir_cash
        
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: